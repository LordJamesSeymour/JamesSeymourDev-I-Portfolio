<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>James Seymour — Portfolio</title>
    <!--
      GitHub Pages SPA fallback.
      GitHub Pages has no server-side rewrites, so a deep link like
      /projects/arcade-machine would 404 on refresh. This script (technique by
      rafgraph/spa-github-pages) rewrites the URL into a query the app can decode
      in index.html, then redirects to "/". See ObsidianVault/08_Deployment.

      pathSegmentsToKeep:
        0  -> user/org site or custom domain (base "/")
        1  -> project site (username.github.io/<repo>, base "/<repo>/")
    -->
    <script>
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
